<header class="topbar">
    <button
        class="mobile-menu btn-icon"
        id="menuToggle"
        aria-label="Mở menu"
        type="button"
    >
        <i class="bi bi-list"></i>
    </button>

    <div class="global-search">
        <i class="bi bi-search"></i>
        <input
            id="globalSearch"
            type="search"
            placeholder="Tìm kiếm học phần, câu hỏi, ma trận..."
        />
        <kbd>Ctrl K</kbd>
    </div>

    <div class="topbar-actions">
        <button class="btn-icon notification" aria-label="Thông báo">
            <i class="bi bi-bell"></i>
            <span></span>
        </button>

        <div class="user-profile">
            <div class="avatar">NA</div>
            <div>
                <strong>Nguyễn Văn A</strong>
                <small>Giảng viên</small>
            </div>
            <i class="bi bi-chevron-down ms-2"></i>
        </div>
    </div>
</header>
